<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Singh Electronics — Electrical & Electronics Shop, Uttar Pradesh</title>
<meta name="description" content="Singh Electronics — quality electrical and electronics products in Uttar Pradesh. Browse fans, lights, switches, wires and more. Order online, pick up in store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --saffron:#E28324;
  --saffron-dark:#B8641A;
  --saffron-tint:#FDEEDA;
  --green:#1F6D4C;
  --green-dark:#154E37;
  --green-tint:#E4F1EA;
  --cream:#FAF6EE;
  --paper:#FFFFFF;
  --ink:#241F18;
  --text:#241F18;
  --surface-strong:#241F18;
  --ink-soft:#645A4A;
  --ink-faint:#8E8371;
  --line:#E8DFCD;
  --danger:#B23B3B;
  --danger-tint:#FBEAEA;
  --radius:10px;
  --shadow:0 1px 2px rgba(36,31,24,0.06),0 4px 14px rgba(36,31,24,0.05);
  --maxw:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --saffron:#F0964A;
    --saffron-dark:#D97B2E;
    --saffron-tint:#3A2A17;
    --green:#4CAF82;
    --green-dark:#357A57;
    --green-tint:#17301F;
    --cream:#15120E;
    --paper:#201B15;
    --text:#F2EAD9;
    --surface-strong:#2C2519;
    --ink-soft:#C7BCA8;
    --ink-faint:#9C9280;
    --line:#3A332A;
    --danger:#E5786F;
    --danger-tint:#3A1F1D;
    --shadow:0 1px 2px rgba(0,0,0,0.5),0 4px 14px rgba(0,0,0,0.4);
  }
}
/* Explicit override from the theme toggle — wins regardless of system setting */
:root[data-theme="dark"]{
  --saffron:#F0964A;
  --saffron-dark:#D97B2E;
  --saffron-tint:#3A2A17;
  --green:#4CAF82;
  --green-dark:#357A57;
  --green-tint:#17301F;
  --cream:#15120E;
  --paper:#201B15;
  --text:#F2EAD9;
  --surface-strong:#2C2519;
  --ink-soft:#C7BCA8;
  --ink-faint:#9C9280;
  --line:#3A332A;
  --danger:#E5786F;
  --danger-tint:#3A1F1D;
  --shadow:0 1px 2px rgba(0,0,0,0.5),0 4px 14px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--cream);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4,.brandfont{font-family:'Poppins',system-ui,sans-serif;}
h1,h2,h3,h4{margin:0;color:var(--text);font-weight:700;letter-spacing:-0.01em;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
/* Form controls and buttons don't inherit text color from the page by
   default in most browsers (they use their own UA default, often black) —
   without this, icons/labels inside them can go invisible on a dark
   background even though every other element correctly follows the theme. */
button,input,select,textarea{color:inherit;font-family:inherit;}
button{cursor:pointer;}
input,select,textarea{font-size:15px;}
button svg,a svg{color:inherit;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px;}
.hide{display:none !important;}
.no-scroll{overflow:hidden;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:8px;border:1px solid transparent;
  font-weight:600;font-size:15px;line-height:1;transition:transform .08s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--saffron);color:#fff;}
.btn-primary:hover{background:var(--saffron-dark);}
.btn-outline{background:transparent;border-color:var(--text);color:var(--text);}
.btn-outline:hover{background:var(--surface-strong);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:7px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ---------- Header ---------- */
#site-header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);}
.topbar{background:var(--green-dark);color:#fff;font-size:12.5px;}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding:6px 18px;gap:10px;flex-wrap:wrap;}
.topbar a{color:#fff;opacity:.92;}
.topbar .pill{background:rgba(255,255,255,0.14);padding:2px 9px;border-radius:20px;font-weight:600;}
.header-main{padding:14px 18px;}
.header-main .wrap{display:flex;align-items:center;gap:18px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-mark{width:40px;height:40px;border-radius:9px;background:linear-gradient(155deg,var(--saffron),var(--green));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Poppins';font-size:18px;flex-shrink:0;}
.logo-text{line-height:1.15;}
.logo-text .name{font-family:'Poppins';font-weight:700;font-size:18px;}
.logo-text .tag{font-size:11px;color:var(--ink-faint);font-weight:500;}
.main-nav{display:flex;align-items:center;gap:2px;margin-left:6px;}
.main-nav a{padding:9px 13px;border-radius:7px;font-weight:600;font-size:14.5px;color:var(--ink-soft);}
.main-nav a:hover,.main-nav a.active{color:var(--text);background:var(--saffron-tint);}
.header-search{flex:1;max-width:420px;position:relative;}
.header-search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:8px;background:var(--cream);font-size:14.5px;}
.header-search input:focus{outline:2px solid var(--saffron);outline-offset:-1px;background:var(--paper);}
.header-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7;color:var(--ink-soft);}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;}
.icon-btn{position:relative;width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;color:var(--text);}
.icon-btn:hover{background:var(--cream);}
.cart-count{position:absolute;top:2px;right:2px;background:var(--saffron);color:#fff;font-size:10.5px;font-weight:700;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12.5px;font-weight:700;flex-shrink:0;}
.lang-toggle button{padding:7px 9px;background:var(--paper);color:var(--ink-soft);border:none;}
.lang-toggle button.active{background:var(--surface-strong);color:#fff;}
.theme-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;}
.theme-toggle button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink-soft);border:none;font-size:15px;}
.theme-toggle button.active{background:var(--surface-strong);color:#fff;}
.hamburger{display:none;width:42px;height:42px;border-radius:8px;border:1px solid var(--line);align-items:center;justify-content:center;background:var(--paper);}

.mobile-menu{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:60;display:none;}
.mobile-menu.open{display:block;}
.mobile-menu-panel{position:absolute;top:0;right:0;bottom:0;width:82%;max-width:320px;background:var(--paper);padding:18px;overflow-y:auto;}
.mobile-menu-panel a{display:block;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:15.5px;}
.mobile-menu-close{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--paper);}

.bottom-nav{display:none;}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(180deg,var(--saffron-tint) 0%, var(--cream) 65%);border-bottom:1px solid var(--line);padding:46px 0 40px;}
.hero .wrap{display:grid;grid-template-columns:1.1fr 0.9fr;gap:36px;align-items:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--green-tint);color:var(--green-dark);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:20px;margin-bottom:16px;}
.hero h1{font-size:40px;line-height:1.1;margin-bottom:12px;}
.hero p.sub{font-size:17px;color:var(--ink-soft);max-width:46ch;margin-bottom:22px;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.hero-facts{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft);}
.hero-facts strong{color:var(--text);}
.hero-art{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);}
.hero-art-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hero-art-tile{background:var(--cream);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--line);}
.hero-art-tile .emo{font-size:26px;}
.hero-art-tile .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:6px;}

/* ---------- Sections ---------- */
.section{padding:42px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:24px;}
.section-head p{color:var(--ink-soft);font-size:14px;margin-top:4px;}
.link-arrow{font-weight:600;color:var(--green-dark);font-size:14px;}

.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.cat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;transition:border-color .15s, transform .1s;}
.cat-card:hover{border-color:var(--saffron);transform:translateY(-2px);}
.cat-card .emo{font-size:26px;margin-bottom:8px;}
.cat-card .lbl{font-size:13.5px;font-weight:600;}
.cat-card .cnt{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.prod-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;}
.prod-card:hover{box-shadow:var(--shadow);border-color:#DED2B8;}
.prod-img{aspect-ratio:1.15/1;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;}
.prod-img .emo{font-size:40px;opacity:.85;}
.prod-img .ph{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
.img-ph .emo{font-size:40px;opacity:.85;}
.img-ph .ph{font-size:10.5px;color:var(--ink-faint);font-weight:600;text-align:center;padding:0 8px;}
.real-img{width:100%;height:100%;object-fit:cover;display:block;}
.prod-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:5px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;}
.badge-featured{background:var(--saffron);color:#fff;}
.badge-out{background:var(--danger);color:#fff;}
.badge-low{background:#946200;color:#fff;}
.prod-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
.prod-cat{font-size:11px;color:var(--ink-faint);font-weight:600;text-transform:capitalize;}
.prod-name{font-size:14.5px;font-weight:700;line-height:1.3;cursor:pointer;}
.prod-name:hover{color:var(--saffron-dark);}
.prod-brand{font-size:12.5px;color:var(--ink-soft);}
.prod-size{font-size:11.5px;color:var(--ink-faint);font-weight:600;}
.prod-meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.prod-price{font-size:16.5px;font-weight:800;color:var(--text);}
.prod-price.na{font-size:12.5px;color:var(--ink-faint);font-weight:600;}
.prod-warranty{font-size:11px;color:var(--green-dark);font-weight:600;background:var(--green-tint);padding:2px 7px;border-radius:5px;display:inline-block;width:fit-content;}
.prod-actions{display:flex;gap:7px;margin-top:9px;}
.prod-actions .btn{flex:1;padding:9px 8px;font-size:13px;}

.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.why-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;}
.why-card .emo{font-size:22px;margin-bottom:8px;}
.why-card h4{font-size:15px;margin-bottom:4px;}
.why-card p{font-size:13.5px;color:var(--ink-soft);}

/* ---------- Founder section ---------- */
.founder-card{display:flex;align-items:center;gap:28px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);}
.founder-photo{width:132px;height:132px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--cream);border:3px solid var(--saffron-tint);}
.founder-photo .img-ph,.founder-photo .real-img{border-radius:50%;}
.founder-photo .img-ph .emo{font-size:44px;}
.founder-photo .img-ph .ph{font-size:10px;}
.founder-info{min-width:0;}
.founder-eyebrow{font-size:12px;font-weight:700;color:var(--saffron-dark);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.founder-name{font-size:22px;margin-bottom:8px;}
.founder-mantra{font-size:16.5px;color:var(--green-dark);font-weight:600;}

/* ---------- UPI payment ---------- */
.pay-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;}
.pay-card h4{font-size:14px;margin-bottom:10px;}
.pay-card-body{display:flex;gap:14px;align-items:flex-start;}
.pay-qr-box{width:110px;height:110px;border-radius:10px;overflow:hidden;background:var(--cream);border:1px solid var(--line);flex-shrink:0;}
.pay-qr-box .img-ph .emo{font-size:30px;}
.pay-qr-box .img-ph .ph{font-size:9.5px;}
.pay-info{min-width:0;flex:1;}
.pay-upi-id{font-weight:700;font-size:14px;word-break:break-all;}
.pay-name{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.pay-note{font-size:12px;color:var(--ink-faint);margin-top:6px;}
@media (max-width:480px){
  .pay-card-body{flex-direction:column;align-items:center;text-align:center;}
}

.pickup-banner{background:var(--green-dark);color:#fff;border-radius:14px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;}
.pickup-banner h3{color:#fff;font-size:19px;margin-bottom:5px;}
.pickup-banner p{color:rgba(255,255,255,0.82);font-size:13.5px;max-width:50ch;}

/* ---------- Filters / catalog ---------- */
.catalog-layout{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:flex-start;}
.filters-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:82px;}
.filters-panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin-bottom:10px;}
.filter-group{margin-bottom:18px;}
.filter-group label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;}
.filter-group select,.filter-group input[type=number]{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:13.5px;}
.filter-row{display:flex;gap:8px;}
.filter-check{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:5px 0;}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-soft);}
.chip.active{background:var(--surface-strong);color:#fff;border-color:var(--surface-strong);}
.catalog-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.result-count{font-size:13.5px;color:var(--ink-soft);}
.sort-select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:13.5px;font-weight:600;}
.empty-state{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;}
.empty-state .emo{font-size:34px;margin-bottom:10px;}
.empty-state h3{font-size:16px;margin-bottom:6px;}
.empty-state p{color:var(--ink-soft);font-size:13.5px;}

/* ---------- Product detail ---------- */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:36px;}
.pdp-img{background:var(--cream);border:1px solid var(--line);border-radius:14px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;position:relative;}
.pdp-img .emo{font-size:80px;}
.pdp-img .real-img{border-radius:13px;}
.pdp-cat{font-size:12.5px;color:var(--saffron-dark);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.pdp h1{font-size:26px;margin-bottom:6px;}
.pdp-brand{font-size:14.5px;color:var(--ink-soft);margin-bottom:14px;}
.pdp-price-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.pdp-price{font-size:28px;font-weight:800;}
.pdp-stock{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;}
.stock-in{background:var(--green-tint);color:var(--green-dark);}
.stock-out{background:var(--danger-tint);color:var(--danger);}
.stock-unspecified{background:var(--cream);color:var(--ink-soft);border:1px solid var(--line);}
.pdp-warranty-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.info-pill{font-size:12.5px;font-weight:600;background:var(--cream);border:1px solid var(--line);padding:6px 11px;border-radius:8px;}
.pdp-desc{font-size:14.5px;color:var(--ink-soft);line-height:1.65;margin-bottom:18px;}
.pdp-specs{border-top:1px solid var(--line);padding-top:14px;margin-bottom:18px;}
.pdp-specs h4{font-size:13px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;letter-spacing:.03em;}
.pdp-specs p{font-size:14px;color:var(--ink-soft);white-space:pre-line;}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.qty-stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.qty-stepper button{width:36px;height:38px;background:var(--paper);border:none;font-size:17px;font-weight:700;}
.qty-stepper button:hover{background:var(--cream);}
.qty-stepper span{width:40px;text-align:center;font-weight:700;font-size:14.5px;}
.pdp-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- Cart ---------- */
.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:flex-start;}
.cart-item{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;align-items:center;}
.cart-item .thumb{width:62px;height:62px;border-radius:8px;background:var(--cream);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;position:relative;}
.cart-item .info{flex:1;min-width:0;}
.cart-item .name{font-weight:700;font-size:14px;}
.cart-item .brand{font-size:12px;color:var(--ink-soft);}
.cart-item .price{font-weight:700;font-size:14px;margin-top:3px;}
.cart-item .remove{font-size:12.5px;color:var(--danger);font-weight:600;background:none;border:none;padding:0;margin-top:4px;}
.summary-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:82px;}
.summary-card h3{font-size:16px;margin-bottom:14px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);margin-bottom:9px;}
.summary-row.total{color:var(--text);font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:11px;margin-top:5px;}
.pickup-note{background:var(--green-tint);color:var(--green-dark);font-size:12.5px;font-weight:600;border-radius:8px;padding:9px 11px;margin-bottom:14px;}

/* ---------- Forms / auth ---------- */
.auth-shell{max-width:420px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 28px;}
.content-page{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 30px;}
.content-page p{color:var(--ink-soft);font-size:14.5px;line-height:1.75;}
@media (max-width:760px){.content-page{padding:20px 18px;}}
.auth-shell h2{font-size:22px;margin-bottom:6px;}
.auth-shell p.sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:14.5px;}
.field input:focus,.field select:focus,.field textarea:focus,.field-focus:focus{outline:2px solid var(--saffron);outline-offset:-1px;}
.field textarea{resize:vertical;min-height:80px;}
.field-error{color:var(--danger);font-size:12.5px;margin-top:5px;font-weight:600;}
.form-msg{font-size:13px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
.form-msg.err{background:var(--danger-tint);color:var(--danger);}
.form-msg.ok{background:var(--green-tint);color:var(--green-dark);}
.auth-switch{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:16px;}
.auth-switch a{font-weight:700;color:var(--saffron-dark);}

/* ---------- Account ---------- */
.acct-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;}
.acct-nav{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;height:fit-content;}
.acct-nav button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:8px;border:none;background:none;font-weight:600;font-size:14px;color:var(--ink-soft);}
.acct-nav button.active{background:var(--saffron-tint);color:var(--text);}
.acct-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;}
.order-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.order-card.order-ready{border-color:var(--green-dark);box-shadow:0 0 0 1px var(--green-dark) inset;}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.order-id{font-weight:700;font-size:13.5px;}
.order-date{font-size:12px;color:var(--ink-faint);}
.status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;}
.st-received{background:#E9EEF5;color:#2E4A7A;}
.st-confirmed{background:var(--green-tint);color:var(--green-dark);}
.st-preparing{background:var(--saffron-tint);color:var(--saffron-dark);}
.st-ready{background:#DFF3E1;color:#1F6D33;}
.st-completed{background:#EDEDED;color:#4A4A4A;}
.st-cancelled{background:var(--danger-tint);color:var(--danger);}
.pay-pending{background:#F3EEE3;color:#8A6D1F;}
.pay-paid{background:var(--green-tint);color:var(--green-dark);}
.pay-failed{background:var(--danger-tint);color:var(--danger);}
.pay-refunded{background:#E9EEF5;color:#2E4A7A;}
.ready-banner{background:var(--green-tint);color:var(--green-dark);font-weight:700;font-size:13px;border-radius:8px;padding:9px 11px;margin-bottom:10px;}
.order-items{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
.order-total{font-weight:700;font-size:14px;}

/* ---------- Admin ---------- */
.admin-tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.admin-tabs button{padding:10px 16px;border:none;background:none;font-weight:700;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;}
.admin-tabs button.active{color:var(--saffron-dark);border-color:var(--saffron);}
.admin-table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.admin-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-faint);background:var(--cream);padding:10px 12px;border-bottom:1px solid var(--line);}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-actions{display:flex;gap:6px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(28,22,14,0.45);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
.modal{background:var(--paper);border-radius:14px;max-width:560px;width:100%;padding:24px;margin-top:20px;}
.modal h3{font-size:18px;margin-bottom:16px;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.small-note{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;}
.stat-card .num{font-size:24px;font-weight:800;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

/* ---------- Image upload (admin) ---------- */
.admin-thumb{width:40px;height:40px;border-radius:7px;background:var(--cream);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;position:relative;flex-shrink:0;}
.img-upload-row{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;}
.img-upload-preview{width:120px;height:120px;border-radius:12px;background:var(--cream);border:1px solid var(--line);overflow:hidden;position:relative;flex-shrink:0;}
.img-upload-actions{display:flex;flex-direction:column;gap:8px;min-width:180px;}
.img-upload-actions .btn{justify-content:flex-start;}
.order-item-row{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.order-item-thumb{width:30px;height:30px;border-radius:6px;background:var(--cream);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden;flex-shrink:0;position:relative;}

/* ---------- Mobile search overlay ---------- */
.mobile-search-btn{display:none;}
.mobile-search-overlay{display:none;}
@media (max-width:760px){
  .mobile-search-btn{display:flex;}
  .mobile-search-overlay.open{display:block;position:fixed;top:0;left:0;right:0;background:var(--paper);z-index:65;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,0.12);}
  .mobile-search-overlay form{display:flex;gap:8px;}
  .mobile-search-overlay input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--cream);color:var(--text);}
  .mobile-search-overlay button.close-x{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--paper);flex-shrink:0;}
}

/* ---------- Contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.contact-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;}
.contact-method{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);}
.contact-method:last-child{border-bottom:none;}
.contact-method .cm-icon{width:42px;height:42px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.contact-method .cm-info{flex:1;}
.contact-method .cm-label{font-size:12px;color:var(--ink-faint);font-weight:600;}
.contact-method .cm-value{font-size:14.5px;font-weight:700;}
.map-placeholder{background:var(--cream);border:1px dashed var(--line);border-radius:12px;height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:20px;}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-strong);color:#fff;padding:12px 20px;border-radius:9px;font-size:14px;font-weight:600;z-index:90;display:none;box-shadow:0 6px 20px rgba(0,0,0,0.2);max-width:90vw;text-align:center;}

/* ---------- Footer ---------- */
footer{background:var(--surface-strong);color:#D8D2C6;margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:26px;padding:40px 18px 26px;}
.footer-col h4{color:#fff;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px;}
.footer-col p,.footer-col a{font-size:13.5px;color:#B7AF9E;display:block;margin-bottom:9px;}
.footer-col a:hover{color:#fff;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.1);padding:16px 18px;text-align:center;font-size:12.5px;color:#8E8571;}

/* ---------- Loading ---------- */
.loading-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-soft);}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--saffron);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .prod-grid{grid-template-columns:repeat(3,1fr);}
  .cat-grid{grid-template-columns:repeat(4,1fr);}
  .catalog-layout{grid-template-columns:1fr;}
  .filters-panel{position:static;}
  .contact-grid{grid-template-columns:1fr;}
  .hero .wrap{grid-template-columns:1fr;}
  .hero-art{order:-1;}
}
@media (max-width:760px){
  .main-nav,.header-search,.header-actions .lang-toggle,.header-actions .theme-toggle{display:none;}
  .hamburger{display:flex;}
  .header-main .wrap{gap:10px;}
  .topbar .wrap{font-size:11.5px;}
  .hero{padding:28px 0 60px;}
  .hero h1{font-size:29px;}
  .hero p.sub{font-size:15px;}
  .cat-grid{grid-template-columns:repeat(3,1fr);}
  .prod-grid{grid-template-columns:repeat(2,1fr);}
  .why-grid{grid-template-columns:1fr;}
  .founder-card{flex-direction:column;text-align:center;padding:22px;}
  .pdp{grid-template-columns:1fr;gap:20px;}
  .cart-layout{grid-template-columns:1fr;}
  .acct-layout{grid-template-columns:1fr;}
  .acct-nav{display:flex;overflow-x:auto;gap:4px;}
  .acct-nav button{white-space:nowrap;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .stat-cards{grid-template-columns:1fr 1fr;}
  .modal-grid{grid-template-columns:1fr;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:45;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-soft);padding:5px 8px;position:relative;}
  .bottom-nav a.active{color:var(--saffron-dark);}
  body{padding-bottom:64px;}
  .section{padding:30px 0;}
}
@media (max-width:440px){
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .prod-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .prod-body{padding:10px;}
}

/* Older orders used a single combined "status". Map them onto the split

function migrateOrder(o){

  delete o.status;
  return o;
}

/* ---------- Utilities ---------- */
function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function money(n){ if(n===null||n===undefined||n==='') return null; return '₹' + Number(n).toLocaleString('en-IN'); }
/* Catalogue prices are free-text as supplied (e.g. "₹ 50+40", "₹ 150") — never
   silently reformatted. priceNumeric() only extracts a plain number when the
   raw string is a single clean amount, for sorting/cart-total purposes;
   anything else (combo prices, unclear prices) is treated as non-numeric and
   shown to the customer exactly as supplied instead of being computed. */
function priceNumeric(raw){
  if(!raw) return null;
  const m = String(raw).trim().match(/^₹?\s*([0-9]+(?:\.[0-9]+)?)\s*$/);
  return m ? Number(m[1]) : null;
}
function priceDisplay(p){ return p.price ? p.price : t('priceNA'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i); h|=0;} return 'h'+h; }
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{el.style.display='none';},2600);
}
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){return '';} }

/* ---------- Storage layer (window.storage with in-memory fallback) ---------- */
const memFallback = {};
async function stGet(key, shared){
  try{
    const r = await window.storage.get(key, !!shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){
    return memFallback[key] !== undefined ? memFallback[key] : null;
  }
}
async function stSet(key, value, shared){
  memFallback[key] = value;
  try{
    await window.storage.set(key, JSON.stringify(value), !!shared);
  }catch(e){ /* fall back to memory-only for this session */ }
}

/* ---------- Product images ----------
   Each product's photo is stored under its own key (se:img:<id>, shared so
   every visitor sees the same photo) instead of inside the 134-item product
   array, since a single storage value is capped at 5MB and many photos
   together would blow past that. Images are resized/compressed in the
   browser before saving so a normal phone photo fits comfortably. A
   same-session in-memory cache avoids re-fetching a photo already shown. */
const imageCache = {}; // productId -> dataURL string | null (checked, none found)
async function fetchProductImage(pid){
  if(imageCache[pid] !== undefined) return imageCache[pid];
  const dataUrl = await stGet('se:img:'+pid, true);
  imageCache[pid] = dataUrl || null;
  return imageCache[pid];
}
async function saveProductImageData(pid, dataUrl){
  await stSet('se:img:'+pid, dataUrl, true);
  imageCache[pid] = dataUrl;
}
async function deleteProductImageData(pid){
  try{ await window.storage.delete('se:img:'+pid, true); }catch(e){ /* ignore */ }
  imageCache[pid] = null;
}
/* Resize to maxDim on the longest side and re-encode as JPEG so uploads from
   a phone camera (often several MB) end up small enough to store and load
   quickly, without needing a real image-hosting backend. */
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read-failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode-failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleProductImageFile(file, pid){
  if(!requireAdmin()) return;
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){ toast('Please choose an image file'); return; }
  if(file.size > 15*1024*1024){ toast('That photo is too large (max 15MB)'); return; }
  toast('Saving photo…');
  try{
    const dataUrl = await compressImageFile(file, 1000, 0.72);
    await saveProductImageData(pid, dataUrl);
    await refreshProducts();
    const p = state.products.find(p=>p.id===pid);
    if(p){ p.hasImage = true; p.updatedAt = new Date().toISOString(); await stSet('se:products', state.products, true); }
    toast('Photo saved');
  }catch(e){ toast('Could not process that photo — try a different file'); }
}
async function removeProductImage(pid){
  if(!requireAdmin()) return;
  if(!confirm('Remove this product photo?')) return;
  await deleteProductImageData(pid);
  await refreshProducts();
  const p = state.products.find(p=>p.id===pid);
  if(p){ p.hasImage = false; p.updatedAt = new Date().toISOString(); await stSet('se:products', state.products, true); }
  toast('Photo removed');
  openProductModal(pid);
}
function onProductImageSelected(inputEl, pid){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if(!file) return;
  handleProductImageFile(file, pid).then(()=> openProductModal(pid));
}

/* Renders either the cached photo, a "loading" placeholder that triggers a
   background fetch (see attachImageLoaders), or the neutral category
   placeholder when the product has no photo. */
function productImageBox(p){
  const emo = catEmo(p.category);
  if(p.hasImage && imageCache[p.id]){
    return `<img class="real-img" src="${imageCache[p.id]}" alt="${escapeHtml(p.name)}">`;
  }
  if(p.hasImage && imageCache[p.id]===undefined){
    return `<div class="img-ph" data-img-pid="${p.id}" data-pending="1" data-emo="${emo}"><div class="emo">${emo}</div><div class="ph">Loading photo…</div></div>`;
  }
  return `<div class="img-ph"><div class="emo">${emo}</div><div class="ph">Photo coming soon</div></div>`;
}
function attachImageLoaders(){
  const pendings = document.querySelectorAll('[data-pending="1"]');
  const seen = new Set();
  pendings.forEach(el=>{
    const pid = el.getAttribute('data-img-pid');
    if(seen.has(pid)) return;
    seen.add(pid);
    fetchProductImage(pid).then(url=>{
      document.querySelectorAll(`[data-img-pid="${pid}"]`).forEach(node=>{
        if(url){
          const img = document.createElement('img');
          img.className = 'real-img';
          img.src = url;
          img.alt = '';
          node.replaceWith(img);
        } else {
          const emo = node.getAttribute('data-emo') || '⚡';
          node.removeAttribute('data-pending');
          node.innerHTML = `<div class="emo">${emo}</div><div class="ph">Photo coming soon</div>`;
        }
      });
    });
  });
}

    stGet('se:users', true),

    stGet('se:cart', false),

    stGet('se:theme', false),
    stGet('se:catalogueVersion', true),
  ]);
  // Force a one-time reseed with the real 134-item catalogue if this store
  // still has the old demo data (or nothing yet). Once the version matches,
  // later admin edits/adds are never overwritten again.
  if(!products || !products.length || catVersion !== CATALOGUE_VERSION){

  state.settings = Object.assign({}, state.settings, settings || {});

  // when it hadn't been provided yet), fill in the now-known real address —

  if(!state.settings.address || !state.settings.address.trim()){

  state.founder = Object.assign({}, state.founder, founder || {});
  state.payment = Object.assign({}, state.payment, payment || {});

  // same pattern as the catalogue reseed above. Runs once; afterward Admin
  // can replace or remove the photo and that choice is respected.

    if(!state.payment.payeeName) state.payment.payeeName = "Ankit singh";

    await stSet('se:payment', state.payment, true);

async function addToCart(pid, qty){

  const existing = state.cart.find(c=>c.productId===pid);
  if(existing){ existing.qty += qty; } else { state.cart.push({productId:pid, qty}); }
  await stSet('se:cart', state.cart, false);
  toast('Added to cart');
  render();
}
async function removeFromCart(pid){
  state.cart = state.cart.filter(c=>c.productId!==pid);
  await stSet('se:cart', state.cart, false);

}
async function setCartQty(pid, qty){
  const it = state.cart.find(c=>c.productId===pid);
  if(!it) return;
  it.qty = Math.max(1, qty);
  await stSet('se:cart', state.cart, false);
  render();
}
function cartLines(){
  return state.cart.map(c=>{
    const p = state.products.find(p=>p.id===c.productId);
    return p ? {product:p, qty:c.qty} : null;
  }).filter(Boolean);
}
function cartTotal(){
  return cartLines().reduce((sum,l)=>{
    const n = priceNumeric(l.product.price);
    return sum + (n!=null ? n*l.qty : 0);
  }, 0);
}
function cartHasUnpriced(){
  return cartLines().some(l=>priceNumeric(l.product.price)==null);
}
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }

/* Storage holds each list (products, orders, users) as ONE array that gets
   rewritten whole. Every browser keeps its own copy from when the page
   loaded, so before changing anything we re-read the latest copy and change
   that — otherwise one person's save could silently erase someone else's
   newer order or stock change. This narrows the window a lot but it is NOT
   a true transaction; guaranteeing that needs a real database/backend. */
async function refreshProducts(){
  const fp = await stGet('se:products', true);
  if(fp && fp.length) state.products = fp;
}
async function refreshShared(){
  const [products, orders, users] = await Promise.all([stGet('se:products', true), stGet('se:orders', true), stGet('se:users', true)]);
  if(products && products.length) state.products = products;
  if(orders) state.orders = orders.map(migrateOrder);
  if(users) state.users = users;
}
async function updateOrder(orderId, mutate){
  const fresh = await stGet('se:orders', true);
  if(fresh) state.orders = fresh.map(migrateOrder);
  const o = state.orders.find(o=>o.id===orderId);
  if(!o) return null;
  mutate(o);
  await stSet('se:orders', state.orders, true);
  return o;
}
function makeOrderId(){
  return 'SE-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,5).toUpperCase();
}
async function placeOrder(){
  const user = currentUser();
  if(!user){ state.pendingCheckout=true; go('#login'); return; }
  await refreshProducts();
  const lines = cartLines();
  if(lines.length===0) return;
  const blocked = lines.find(l => stockDisplay(l.product)==='Out of Stock' || (l.product.stockQty!=null && l.qty > l.product.stockQty));
  if(blocked){
    const b = blocked.product;
    toast(stockDisplay(b)==='Out of Stock'
      ? `"${b.name}" is out of stock — please remove it from your cart.`
      : `Only ${b.stockQty} of "${b.name}" available — please reduce the quantity.`);
    render();
    return;
  }
  const now = new Date().toISOString();
  const order = {
    id: makeOrderId(),
    userId:user.id,
    items: lines.map(l=>({productId:l.product.id,name:l.product.name,brand:l.product.brand,sizeRating:l.product.sizeRating,price:l.product.price,qty:l.qty})),
    total: cartTotal(),
    hasUnpriced: cartHasUnpriced(),
    orderStatus:'Placed',
    paymentStatus:'Pending',
    statusUpdatedAt: now,
    paymentStatusUpdatedAt: now,
    pickup:true,
    createdAt: now,
  };
  // Decrement real stock counts only where the shop has actually entered a
  // quantity. Items without a tracked quantity (most of the original
  // catalogue — no starting counts were ever provided) are left alone
  // rather than guessing a number.
  lines.forEach(l=>{
    if(l.product.stockQty != null){
      l.product.stockQty = Math.max(0, l.product.stockQty - l.qty);
      l.product.updatedAt = now;
    }
  });
  const freshOrders = await stGet('se:orders', true);
  if(freshOrders) state.orders = freshOrders.map(migrateOrder);
  state.orders.push(order);
  await stSet('se:orders', state.orders, true);
  await stSet('se:products', state.products, true);
  state.cart=[];
  await stSet('se:cart', state.cart, false);
  toast(t('orderConfirmed'));
  go('#order-'+order.id);
}

/* ---------- Filtering / sorting ---------- */
/* ---------- Smart local-language search ----------
   Village/local customers often search using everyday spoken words
   (Hindi, Hinglish, or a mix) rather than the catalogue's English product
   names. This maps common local terms to the English keywords actually
   used in the catalogue, so a search for "batti" still finds LED bulbs,
   "tar" finds wire, etc. — without needing an external search service. */
const SEARCH_SYNONYMS = {
  'batti':'led bulb light', 'bulb':'led bulb light', 'बत्ती':'led bulb light', 'बल्ब':'led bulb light',
  'lait':'led bulb light', 'light':'led bulb light', 'roshni':'led bulb light', 'रोशनी':'led bulb light',
  'tar':'wire cable', 'cable':'wire cable', 'तार':'wire cable', 'wire':'wire cable',
  'switch':'switch', 'स्विच':'switch', 'button':'switch', 'batan':'switch', 'बटन':'switch',
  'plug':'plug pin top', 'pin':'plug pin top', 'प्लग':'plug pin top',
  'socket':'socket', 'सॉकेट':'socket',
  'ghanti':'door bell', 'bell':'door bell', 'घंटी':'door bell',
  'fuse':'mcb', 'फ्यूज':'mcb', 'mcb':'mcb',
  'board':'switch board power board', 'बोर्ड':'switch board power board',
  'holder':'holder', 'होल्डर':'holder',
  'regulator':'regulator', 'रेगुलेटर':'regulator',
  'pankha':'fan', 'पंखा':'fan', 'fan':'fan',
  'pump':'submersible pump', 'पंप':'submersible pump', 'motor':'submersible pump motor', 'मोटर':'submersible pump motor',
  'heater':'heater element', 'हीटर':'heater element', 'garam':'heater element',
  'capacitor':'capacitor', 'कैपेसिटर':'capacitor', 'condenser':'capacitor',
  'charger':'charger adapter', 'चार्जर':'charger adapter', 'adapter':'charger adapter',
  'tubelight':'tubelight', 'ट्यूबलाइट':'tubelight',
  'multiplug':'multiplug power board', 'extension':'power board multiplug',
  'katrani':'wire stripper cutter', 'cutter':'wire stripper cutter',
  'tester':'tester', 'टेस्टर':'tester',
  'gang':'gang box', 'dabba':'box', 'डिब्बा':'box', 'box':'box',
  // "amp"/"ampere" never appear literally in the data (it says "6A"), so map
  // them to the bare letter used in Size/Rating — harmless alone, but lets
  // "6 amp socket" actually match 6A sockets instead of returning nothing.
  'amp':'a', 'amps':'a', 'ampere':'a', 'एम्पियर':'a',
};
/* Whole-phrase colloquial expressions, substituted before the query is
   split into words — e.g. "log jalane wala" (village Hindi for "the thing
   that lights up") has no useful single-word match on its own. */
const SEARCH_PHRASES = {
  'log jalane wala':'led bulb light', 'batti jalane wala':'led bulb light',
  'jalane wala':'led bulb light', 'jalne wala':'led bulb light',
  'जलाने वाला':'led bulb light', 'लाइट जलाने वाला':'led bulb light',
  'bijli ka tar':'wire cable', 'बिजली का तार':'wire cable',
};
function expandSearchTerms(word){
  const terms = new Set([word]);
  if(word.length < 2) return Array.from(terms);
  Object.keys(SEARCH_SYNONYMS).forEach(key=>{
    const matches = word.length >= 3 ? (word.includes(key) || key.includes(word)) : (word === key);
    if(matches){ SEARCH_SYNONYMS[key].split(' ').forEach(w=>{ if(w) terms.add(w); }); }
  });
  return Array.from(terms);
}
function preprocessQuery(rawQ){
  let q = rawQ.trim().toLowerCase();
  Object.keys(SEARCH_PHRASES).forEach(phrase=>{
    if(q.includes(phrase)){ q = q.split(phrase).join(' ' + SEARCH_PHRASES[phrase] + ' '); }
  });
  return q.replace(/\s+/g,' ').trim();
}
function productMatchesToken(p, token){
  const terms = expandSearchTerms(token);
  const haystacks = [(p.name||'').toLowerCase(), (p.brand||'').toLowerCase(), (p.sizeRating||'').toLowerCase(), catLabel(p.category).toLowerCase()];
  return terms.some(term => haystacks.some(h=>h.includes(term)));
}
function filteredProducts(){
  let list = state.products.slice();
  const rawQ = state.search.trim();
  if(rawQ){
    // Every word typed must match something (itself or a synonym), so
    // "6 amp socket" narrows to 6A sockets, not anything with any one word.
    const tokens = preprocessQuery(rawQ).split(' ').filter(Boolean);
    list = list.filter(p => tokens.every(tok => productMatchesToken(p, tok)));
  }
  const f = state.filters;
  if(f.category) list = list.filter(p=>p.category===f.category);
  if(f.brand) list = list.filter(p=>p.brand===f.brand);
  if(f.minPrice!=='' && f.minPrice!=null) list = list.filter(p=> priceNumeric(p.price)!=null && priceNumeric(p.price)>=Number(f.minPrice));
  if(f.maxPrice!=='' && f.maxPrice!=null) list = list.filter(p=> priceNumeric(p.price)!=null && priceNumeric(p.price)<=Number(f.maxPrice));
  if(f.inStockOnly) list = list.filter(p=>stockDisplay(p)==='In Stock');
  switch(f.sort){
    case 'price-asc': list.sort((a,b)=>(priceNumeric(a.price)??Infinity)-(priceNumeric(b.price)??Infinity)); break;
    case 'price-desc': list.sort((a,b)=>(priceNumeric(b.price)??-Infinity)-(priceNumeric(a.price)??-Infinity)); break;
    case 'name-asc': list.sort((a,b)=>a.name.localeCompare(b.name)); break;
    case 'name-desc': list.sort((a,b)=>b.name.localeCompare(a.name)); break;
    default: list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  }
  return list;
}
function allBrands(){ return [...new Set(state.products.map(p=>p.brand).filter(Boolean))].sort(); }

function render(){
  const app = document.getElementById('app');
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  const activeSel = (activeId && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
  if(state.loading){
    app.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><p>Loading Singh Electronics…</p></div>`;
    return;
  }
  const route = state.route || '#home';
  let body = '';
  if(route === '#home') body = viewHome();
  else if(route === '#products') body = viewProducts();
  else if(route.startsWith('#product-')) body = viewProductDetail(route.slice(9));
  else if(route === '#cart') body = viewCart();
  else if(route === '#login') body = viewAuth('login');
  else if(route === '#register') body = viewAuth('register');
  else if(route === '#account') body = viewAccount();
  else if(route.startsWith('#order-')) body = viewOrderConfirm(route.slice(7));
  else if(route === '#admin') body = viewAdmin();
  else if(route === '#contact') body = viewContact();
  else if(route === '#about') body = viewAbout();
  else if(route === '#privacy') body = viewPrivacy();
  else if(route === '#terms') body = viewTerms();
  else if(route === '#pickup-info') body = viewPickupInfo();
  else body = viewNotFound();

  app.innerHTML = `
    ${renderHeader()}
    <main>${body}</main>
    ${renderFooter()}
    ${renderBottomNav()}
    ${renderMobileMenu()}
    ${renderMobileSearchOverlay()}
  `;
  attachDynamicHandlers();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el && el.focus){
      el.focus();
      if(activeSel!=null && el.setSelectionRange){ try{ el.setSelectionRange(activeSel, activeSel); }catch(e){ /* not a text input */ } }
    }
  }
}

/* ---- Product card ---- */
function productCard(p){
  const priceStr = p.price || null;
  const out = stockDisplay(p) === 'Out of Stock';
  return `

    <div class="prod-img" onclick="go('#product-${p.id}')" style="cursor:pointer;">
      ${p.featured || out || (p.stockQty!=null && p.stockQty>0 && p.stockQty<=3) ? `<div class="prod-badges">
        ${p.featured?`<span class="badge badge-featured">Featured</span>`:''}
        ${out?`<span class="badge badge-out">${t('outOfStock')}</span>`:''}
        ${(!out && p.stockQty!=null && p.stockQty>0 && p.stockQty<=3)?`<span class="badge badge-low">Only ${p.stockQty} left</span>`:''}
      </div>`:''}
      ${productImageBox(p)}
    </div>
    <div class="prod-body">
      <div class="prod-cat">${escapeHtml(catLabel(p.category))}</div>
      <div class="prod-name" onclick="go('#product-${p.id}')">${escapeHtml(p.name)}</div>
      <div class="prod-brand">${escapeHtml(p.brand || t('brandNA'))}</div>
      ${p.sizeRating ? `<div class="prod-size">${escapeHtml(p.sizeRating)}</div>` : ''}
      <div class="prod-meta-row">
        <span class="${priceStr?'prod-price':'prod-price na'}">${priceStr || t('priceNA')}</span>
      </div>
      <span class="prod-warranty">${escapeHtml(p.warranty || t('warrantyNA'))}</span>
      <div class="prod-actions">
        <button class="btn btn-outline" onclick="go('#product-${p.id}')">${t('viewDetails')}</button>
        <button class="btn btn-primary" ${out?'disabled':''} onclick="addToCart('${p.id}',1)">${t('addCart')}</button>
      </div>
    </div>
  </div>`;
}

/* ---- Product detail ---- */
function viewProductDetail(id){
  const p = state.products.find(p=>p.id===id);
  if(!p) return `<div class="wrap section"><div class="empty-state"><div class="emo">📦</div><h3>Product not found</h3><p>This product may have been removed.</p><br><a href="#products" class="btn btn-primary">${t('products')}</a></div></div>`;
  const priceStr = p.price || null;
  const out = stockDisplay(p) === 'Out of Stock';
  const stockLabel = out ? t('outOfStock') : (stockDisplay(p)==='In Stock' ? (p.stockQty!=null ? `In Stock (${p.stockQty} left)` : 'In Stock') : 'Stock Not Confirmed');
  const stockClass = out ? 'stock-out' : (stockDisplay(p)==='In Stock' ? 'stock-in' : 'stock-unspecified');
  return `
  <section class="wrap section">
    <div class="pdp">
      <div class="pdp-img">
        ${productImageBox(p)}
      </div>
      <div>
        <div class="pdp-cat">${escapeHtml(catLabel(p.category))}</div>
        <h1>${escapeHtml(p.name)}</h1>
        <div class="pdp-brand">Brand: ${escapeHtml(p.brand || t('brandNA'))}</div>
        <div class="pdp-price-row">
          <span class="pdp-price">${priceStr || t('priceNA')}</span>
          <span class="pdp-stock ${stockClass}">${stockLabel}</span>
        </div>
        <div class="pdp-warranty-row">
          ${p.sizeRating ? `<span class="info-pill">📏 ${escapeHtml(p.sizeRating)}</span>` : `<span class="info-pill">📏 Size/Rating Not Specified</span>`}
          <span class="info-pill">🛡️ ${escapeHtml(p.warranty || t('warrantyNA'))}</span>
        </div>
        <p class="pdp-desc">${escapeHtml(p.description || 'No description provided for this product yet.')}</p>
        ${p.specifications ? `<div class="pdp-specs"><h4>Specifications</h4><p>${escapeHtml(p.specifications)}</p></div>` : ''}
        <div class="qty-row">
          <div class="qty-stepper">
            <button onclick="stepQty(-1)">−</button>
            <span id="pdp-qty">1</span>
            <button onclick="stepQty(1)">+</button>
          </div>
        </div>
        <div class="pdp-actions">
          <button class="btn btn-primary" ${out?'disabled':''} onclick="addToCart('${p.id}', getPdpQty())">${t('addCart')}</button>
          <a class="btn btn-outline" href="${waLink()}" target="_blank" rel="noopener">💬 Ask on WhatsApp</a>
        </div>
      </div>
    </div>
  </section>`;
}
function stepQty(d){
  const el = document.getElementById('pdp-qty');
  if(!el) return;
  let v = Math.max(1, parseInt(el.textContent||'1',10)+d);
  el.textContent = v;
}
function getPdpQty(){ const el=document.getElementById('pdp-qty'); return el ? parseInt(el.textContent||'1',10) : 1; }

function viewCart(){
  const lines = cartLines();
  if(!lines.length){
    return `<section class="wrap section"><div class="empty-state">

      <a href="#products" class="btn btn-primary">${t('continueShopping')}</a>
    </div></section>`;
  }
  const total = cartTotal();
  const unpriced = cartHasUnpriced();
  return `
  <section class="wrap section">
    <div class="section-head"><h2>${t('yourCart')}</h2></div>
    <div class="cart-layout">
      <div>
        ${lines.map(l=>`
          <div class="cart-item">
            <div class="thumb">${productImageBox(l.product)}</div>
            <div class="info">
              <div class="name">${escapeHtml(l.product.name)}</div>
              <div class="brand">${escapeHtml(l.product.brand || t('brandNA'))}${l.product.sizeRating?' · '+escapeHtml(l.product.sizeRating):''}</div>
              <div class="price">${l.product.price || t('priceNA')} × ${l.qty}</div>
              <button class="remove" onclick="removeFromCart('${l.product.id}')">Remove</button>
            </div>
            <div class="qty-stepper">

              <button onclick="setCartQty('${l.product.id}', ${l.qty+1})">+</button>
            </div>
          </div>`).join('')}
        <a href="#products" class="btn btn-ghost" style="margin-top:6px;">← ${t('continueShopping')}</a>
      </div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="pickup-note">📦 ${t('pickupNoteCart')}</div>
        <div class="summary-row"><span>${unpriced?'Estimated ':''}${t('subtotal')}</span><span>${money(total)}</span></div>
        <div class="summary-row"><span>Delivery</span><span>${t('noDelivery')}</span></div>
        <div class="summary-row total"><span>${unpriced?'Estimated ':''}${t('total')}</span><span>${money(total)}</span></div>
        ${unpriced ? `<p class="small-note" style="margin:10px 0;">Some items have variable or unconfirmed pricing — the exact total will be confirmed at the shop.</p>` : ''}
        <button class="btn btn-primary btn-block" onclick="placeOrder()">${t('proceed')}</button>
        ${!currentUser() ? `<p class="small-note" style="text-align:center;margin-top:10px;">${t('loginRequired')}</p>` : ''}
        ${paymentSection()}
      </div>
    </div>
  </section>`;
}

function statusClass(s){
  return {'Placed':'st-received','Confirmed':'st-confirmed','Ready for Pickup':'st-ready','Completed':'st-completed','Cancelled':'st-cancelled'}[s] || 'st-received';
}
function paymentStatusClass(s){
  return {'Pending':'pay-pending','Paid':'pay-paid','Failed':'pay-failed','Refunded':'pay-refunded'}[s] || 'pay-pending';
}
function orderItemThumb(i){
  const p = state.products.find(p=>p.id===i.productId);
  if(p) return `<div class="order-item-thumb">${productImageBox(p)}</div>`;
  return `<div class="order-item-thumb"><div class="emo" style="font-size:14px;">📦</div></div>`;
}
/* Customers can self-cancel only before the shop has started getting the
   order ready. After that, cancelling needs a real conversation with the
   shop (WhatsApp/call), not a silent one-tap undo. */
function canCustomerCancel(o){
  return o.orderStatus === 'Placed' || o.orderStatus === 'Confirmed';
}
async function cancelMyOrder(orderId){
  await refreshShared();   // judge the cancel rule against the latest status, not a stale copy
  const o0 = state.orders.find(o=>o.id===orderId);
  const u = currentUser();
  if(!o0 || !u || o0.userId !== u.id) return;
  if(!canCustomerCancel(o0)){ toast('This order can no longer be cancelled here — please contact the shop.'); render(); return; }
  if(!confirm('Cancel this order? This cannot be undone — contact the shop on WhatsApp if you need to reorder.')) return;
  await updateOrder(orderId, o=>{
    if(canCustomerCancel(o)){ o.orderStatus = 'Cancelled'; o.statusUpdatedAt = new Date().toISOString(); }
  });
  toast('Order cancelled');
  render();
}
function orderCard(o){
  const ready = o.orderStatus === 'Ready for Pickup';
  return `
  <div class="order-card ${ready?'order-ready':''}">
    <div class="top">
      <span class="order-id">#${escapeHtml(o.id)}</span>
      <span class="status-pill ${statusClass(o.orderStatus)}">${escapeHtml(o.orderStatus)}</span>
      <span class="status-pill ${paymentStatusClass(o.paymentStatus)}">Payment: ${escapeHtml(o.paymentStatus)}</span>
    </div>
    ${ready ? `<div class="ready-banner">🎉 Ready for pickup — please collect it from the shop during opening hours.</div>` : ''}
    <div class="order-date">Placed ${fmtDate(o.createdAt)} · Updated ${fmtDate(o.statusUpdatedAt||o.createdAt)}</div>
    <div class="order-items">${o.items.map(i=>`<div class="order-item-row">${orderItemThumb(i)}<span>${escapeHtml(i.name)} × ${i.qty}</span></div>`).join('')}</div>
    <div class="order-total">${o.hasUnpriced?'Estimated ':''}${t('total')}: ${money(o.total)}</div>
    ${canCustomerCancel(o) ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="cancelMyOrder('${o.id}')">Cancel Order</button>` : ''}
  </div>`;
}

function adminCatalogue(){
  const withSr = state.products.filter(p=>p.srNo!=null);
  const counts = {Confirmed:0, Likely:0, 'Not Clear':0};
  withSr.forEach(p=>{ if(counts[p.status]!=null) counts[p.status]++; });
  const srNums = withSr.map(p=>p.srNo).sort((a,b)=>a-b);
  const missing=[];
  for(let i=1;i<=134;i++){ if(!srNums.includes(i)) missing.push(i); }
  const dupes = srNums.filter((n,i)=>srNums.indexOf(n)!==i);
  return `
  <div class="stat-cards">
    <div class="stat-card"><div class="num">${withSr.length}</div><div class="lbl">Catalogue Products</div></div>
    <div class="stat-card"><div class="num">${counts.Confirmed}</div><div class="lbl">Confirmed</div></div>
    <div class="stat-card"><div class="num">${counts.Likely}</div><div class="lbl">Likely</div></div>
    <div class="stat-card"><div class="num">${counts['Not Clear']}</div><div class="lbl">Not Clear</div></div>
  </div>
  ${missing.length? `<div class="form-msg err">Missing catalogue serial numbers: ${missing.join(', ')}</div>` : `<div class="form-msg ok">All catalogue serial numbers 1–134 are present, with no gaps.</div>`}
  ${dupes.length? `<div class="form-msg err">Duplicate serial numbers detected: ${[...new Set(dupes)].join(', ')}</div>` : ''}
  <p class="small-note">The Confirmed / Likely / Not Clear status is an internal catalogue-confidence label from the original import — it is never shown to customers. Products added later through "+ Add Product" have no serial number and are not counted in this summary.</p>
  `;
}

            <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">Delete</button>
          </td>
        </tr>`).join('')}
    </tbody>
  </table>
  </div>`;
}
function setAdminProductSearch(v){ state.adminProductSearch=v; render(); }
async function setProductStock(pid, status){
  if(!requireAdmin()) return;
  await refreshProducts();
  const p = state.products.find(p=>p.id===pid);
  if(p){ p.stockStatus=status; p.updatedAt=new Date().toISOString(); await stSet('se:products', state.products, true); render(); }
}
async function setProductStockQty(pid, value){
  if(!requireAdmin()) return;
  await refreshProducts();
  const p = state.products.find(p=>p.id===pid);
  if(!p) return;
  p.stockQty = (value==='' || value==null) ? null : Math.max(0, parseInt(value,10)||0);
  p.updatedAt = new Date().toISOString();
  await stSet('se:products', state.products, true);
  render();
}
async function clearProductStockQty(pid){
  if(!requireAdmin()) return;
  await refreshProducts();
  const p = state.products.find(p=>p.id===pid);
  if(!p) return;
  p.stockQty = null;
  p.updatedAt = new Date().toISOString();
  await stSet('se:products', state.products, true);
  render();
}
/* Single source of truth for displayed stock: a tracked quantity (when the
   shop has entered one) always wins over the manual dropdown, so the two
   can never contradict each other. */
function stockDisplay(p){
  if(p.stockQty != null) return p.stockQty > 0 ? 'In Stock' : 'Out of Stock';
  return p.stockStatus || 'Not Specified';
}

function adminOrders(){
  const orders = state.orders.slice().reverse();
  if(!orders.length) return `<div class="empty-state"><div class="emo">📦</div><h3>No orders yet</h3></div>`;
  return `<div style="overflow-x:auto;">
  <button class="btn btn-outline btn-sm" style="margin-bottom:10px;" onclick="refreshShared().then(render)">🔄 Check for new orders</button>
  <p class="small-note" style="margin-bottom:10px;">Order status and payment status are tracked separately. Only set Payment to "Paid" after you've personally verified the money arrived — this site cannot verify payments automatically.</p>
  <table class="admin-table">
    <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Date</th><th>Order Status</th><th>Payment Status</th></tr></thead>
    <tbody>
      ${orders.map(o=>{
        const u = state.users.find(u=>u.id===o.userId);
        return `<tr>
          <td>#${escapeHtml(o.id)}</td>
          <td>${escapeHtml(u?u.name:'Unknown')}<br><span class="small-note">${escapeHtml(u?u.phone:'')}</span></td>
          <td>${o.items.map(i=>escapeHtml(i.name)+' × '+i.qty).join('<br>')}</td>
          <td>${o.hasUnpriced?'~ ':''}${money(o.total)}</td>
          <td>${fmtDate(o.createdAt)}<br><span class="small-note">Updated ${fmtDate(o.statusUpdatedAt||o.createdAt)}</span></td>
          <td><select onchange="setOrderStatus('${o.id}', this.value)">
            ${ORDER_STATUSES.map(s=>`<option value="${s}" ${o.orderStatus===s?'selected':''}>${s}</option>`).join('')}
          </select></td>
          <td><select onchange="setPaymentStatus('${o.id}', this.value)">
            ${PAYMENT_STATUSES.map(s=>`<option value="${s}" ${o.paymentStatus===s?'selected':''}>${s}</option>`).join('')}
          </select></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>
  </div>`;
}

function adminCustomers(){
  if(!state.users.length) return `<div class="empty-state"><div class="emo">👥</div><h3>No customers yet</h3></div>`;
  return `<div style="overflow-x:auto;">
  <table class="admin-table">
    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>Joined</th></tr></thead>
    <tbody>
      ${state.users.map(u=>`
        <tr>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.phone)}</td>
          <td>${escapeHtml(u.email||'—')}</td>
          <td>${state.orders.filter(o=>o.userId===u.id).length}</td>
          <td>${fmtDate(u.createdAt)}</td>
        </tr>`).join('')}
    </tbody>
  </table>
  </div>`;
}

function adminFounder(){
  const f = state.founder;
  return `
  <div style="max-width:520px;">
    <p class="small-note" style="margin-bottom:14px;">Shown on the homepage as a Founder section. No ID/Aadhaar or other identity document is collected here — just a name, an optional mantra, and an optional photo.</p>
    <div class="img-upload-row">
      <div class="img-upload-preview" style="border-radius:50%;">${founderImageBox()}</div>
      <div class="img-upload-actions">
        <input type="file" accept="image/*" capture="user" id="founder-cam" style="display:none" onchange="onFounderImageSelected(this)">
        <input type="file" accept="image/*" id="founder-gal" style="display:none" onchange="onFounderImageSelected(this)">
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('founder-cam').click()">📷 Take Photo</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('founder-gal').click()">🖼️ Choose from Gallery</button>
        ${f.hasImage ? `<button type="button" class="btn btn-ghost btn-sm" onclick="removeFounderImage()">Remove Photo</button>` : ''}
      </div>
    </div>
    <form onsubmit="event.preventDefault(); saveFounder({name:this.name.value.trim(), mantra:this.mantra.value.trim()});">
      <div class="field"><label>Founder Name</label><input name="name" value="${escapeHtml(f.name)}" placeholder="e.g. Mr. Dindayal Singh"></div>
      <div class="field"><label>Mantra</label><input name="mantra" value="${escapeHtml(f.mantra)}" placeholder="e.g. ॐ श्री गणेशाय नमः"></div>
      <button class="btn btn-primary" type="submit">Save Founder Details</button>
    </form>
    <p class="small-note" style="margin-top:12px;">Leave a field blank to hide it on the homepage. If both name and mantra are blank and no photo is set, the section is hidden entirely.</p>
  </div>`;
}

function adminPayment(){
  const p = state.payment;
  return `
  <div style="max-width:520px;">
    <p class="small-note" style="margin-bottom:14px;">This shows a static UPI QR on the Cart and Order Confirmation pages as an <strong>optional</strong> way to pay — it does not verify or confirm payment automatically. Orders still go through the same pickup flow regardless of whether it's used; verifying payment happens the same way it always has, in person at the shop.</p>
    <div class="field"><label class="filter-check"><input type="checkbox" ${p.enabled?'checked':''} onchange="savePayment({enabled:this.checked})"> Show UPI payment option to customers</label></div>
    <div class="img-upload-row">
      <div class="img-upload-preview">${paymentImageBox()}</div>
      <div class="img-upload-actions">
        <input type="file" accept="image/*" id="pay-cam" style="display:none" onchange="onPaymentImageSelected(this)">
        <input type="file" accept="image/*" id="pay-gal" style="display:none" onchange="onPaymentImageSelected(this)">
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pay-cam').click()">📷 Take Photo</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pay-gal').click()">🖼️ Choose from Gallery</button>
        ${p.hasImage ? `<button type="button" class="btn btn-ghost btn-sm" onclick="removePaymentImage()">Remove QR Photo</button>` : ''}
      </div>
    </div>
    <form onsubmit="event.preventDefault(); savePayment({upiId:this.upiId.value.trim(), payeeName:this.payeeName.value.trim()});">
      <div class="field"><label>UPI ID</label><input name="upiId" value="${escapeHtml(p.upiId)}" placeholder="e.g. name@bank"></div>
      <div class="field"><label>Payee Name (as shown to customers)</label><input name="payeeName" value="${escapeHtml(p.payeeName)}" placeholder="e.g. Singh Electronics"></div>
      <button class="btn btn-primary" type="submit">Save Payment Details</button>
    </form>
    <p class="small-note" style="margin-top:12px;">Leave both blank and remove the photo to hide this section entirely.</p>
  </div>`;
}

function adminSettings(){
  const s = state.settings;
  return `
  <div style="max-width:520px;">
    <form onsubmit="event.preventDefault(); saveSettings({phone:this.phone.value.trim(), email:this.email.value.trim(), hours:this.hours.value.trim(), address:this.address.value.trim()});">
      <div class="field"><label>WhatsApp / Contact Number</label><input name="phone" value="${escapeHtml(s.phone)}" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" value="${escapeHtml(s.email)}" required></div>
      <div class="field"><label>Opening Hours</label><input name="hours" value="${escapeHtml(s.hours)}" required></div>
      <div class="field"><label>Shop Address</label><textarea name="address" placeholder="Leave blank to show 'Shop Address Coming Soon'">${escapeHtml(s.address)}</textarea></div>
      <button class="btn btn-primary" type="submit">Save Shop Settings</button>
    </form>
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--line);">
    <form onsubmit="event.preventDefault(); if(this.pw.value.length<4){toast('Password too short');return;} saveSettings({adminPassword:this.pw.value}); this.reset();">
      <div class="field"><label>Change Admin Password</label><input name="pw" type="password" minlength="4" placeholder="New admin password" required></div>
      <button class="btn btn-outline" type="submit">Update Password</button>
    </form>
    <p class="small-note" style="margin-top:14px;">Note: this is a lightweight demo login for the prototype, stored in the app's data store — not a hardened production authentication system.</p>
  </div>`;
}

/* Product modal (create/edit) */
function openProductModal(editId){
  const p = editId ? state.products.find(p=>p.id===editId) : null;
  state.__modal = `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${p?'Edit Product':'Add Product'}</h3>
      ${p ? `
      <div class="img-upload-row">
        <div class="img-upload-preview">${productImageBox(p)}</div>
        <div class="img-upload-actions">
          <input type="file" accept="image/*" capture="environment" id="cam-${p.id}" style="display:none" onchange="onProductImageSelected(this, '${p.id}')">
          <input type="file" accept="image/*" id="gal-${p.id}" style="display:none" onchange="onProductImageSelected(this, '${p.id}')">
          <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('cam-${p.id}').click()">📷 Take Photo</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('gal-${p.id}').click()">🖼️ Choose from Gallery</button>
          ${p.hasImage ? `<button type="button" class="btn btn-ghost btn-sm" onclick="removeProductImage('${p.id}')">Remove Photo</button>` : ''}
        </div>
      </div>
      ` : `
      <div class="form-msg ok" style="margin-bottom:16px;">Save this product first, then reopen it to add a photo.</div>
      `}
      <form onsubmit="event.preventDefault(); submitProductForm(this, ${p?`'${p.id}'`:'null'});">
        <div class="modal-grid">
          <div class="field" style="grid-column:1/-1;"><label>Product Name *</label><input name="name" required value="${p?escapeHtml(p.name):''}"></div>
          <div class="field"><label>Brand</label><input name="brand" value="${p?escapeHtml(p.brand||''):''}" placeholder="Leave blank if unknown"></div>
          <div class="field"><label>Category *</label>
            <select name="category" required>${CATEGORIES.map(c=>`<option value="${c.id}" ${p&&p.category===c.id?'selected':''}>${c.label}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Size/Rating</label><input name="sizeRating" value="${p?escapeHtml(p.sizeRating||''):''}" placeholder="e.g. 6A, 9W, 1.5 sq.mm"></div>
          <div class="field"><label>Price</label><input name="price" type="text" value="${p&&p.price!=null?escapeHtml(p.price):''}" placeholder="e.g. ₹ 150 — leave blank if unavailable">
            <p class="small-note">Include the ₹ symbol. Kept exactly as typed — not auto-corrected.</p>
          </div>
          <div class="field"><label>Warranty</label><input name="warranty" value="${p?escapeHtml(p.warranty||''):''}" placeholder="e.g. 1 Year"></div>
          <div class="field"><label>Stock Quantity (optional)</label><input name="stockQty" type="number" min="0" value="${p&&p.stockQty!=null?p.stockQty:''}" placeholder="Leave blank if unknown">
            <p class="small-note">If set, this drives In/Out of Stock automatically and drops by 1 each time it's ordered.</p>
          </div>
          <div class="field"><label>Stock Status ${p&&p.stockQty!=null?'(overridden by quantity)':''}</label>
            <select name="stockStatus" ${p&&p.stockQty!=null?'disabled':''}>
              <option ${(!p||p.stockStatus==='Not Specified')?'selected':''}>Not Specified</option>
              <option ${p&&p.stockStatus==='In Stock'?'selected':''}>In Stock</option>
              <option ${p&&p.stockStatus==='Out of Stock'?'selected':''}>Out of Stock</option>
            </select>
          </div>
          <div class="field"><label class="filter-check" style="margin-top:26px;"><input type="checkbox" name="featured" ${p&&p.featured?'checked':''}> Featured on homepage</label></div>
          <div class="field" style="grid-column:1/-1;"><label>Description</label><textarea name="description">${p?escapeHtml(p.description||''):''}</textarea></div>
          <div class="field" style="grid-column:1/-1;"><label>Specifications</label><textarea name="specifications" placeholder="One per line">${p?escapeHtml(p.specifications||''):''}</textarea></div>
        </div>
        <div class="modal-close-row">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">${p?'Save Changes':'Add Product'}</button>
        </div>
      </form>
    </div>
  </div>`;
  render();
}
function closeModal(){ state.__modal=''; render(); }
function submitProductForm(form, editId){
  const data = {
    name: form.name.value.trim(),
    brand: form.brand.value.trim() || null,
    category: form.category.value,
    sizeRating: form.sizeRating.value.trim() || null,
    price: form.price.value.trim() || null,
    warranty: form.warranty.value.trim() || null,
    stockStatus: form.stockStatus.value,
    stockQty: form.stockQty.value==='' ? null : Math.max(0, parseInt(form.stockQty.value,10)||0),
    featured: form.featured.checked,
    description: form.description.value.trim(),
    specifications: form.specifications.value.trim(),
  };
  saveProduct(data, editId).then(id=>{
    if(!editId){
      toast('Product added — you can now add a photo');
      openProductModal(id);
    } else {
      state.__modal='';
      toast('Product updated');
      render();
    }
  });
}

/* ---------- Post-render wiring ---------- */
function attachDynamicHandlers(){
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    // hash links work natively; nothing extra needed
  });
  attachImageLoaders();
}

/* ---------- Init ---------- */
async function init(){
  render(); // loading state
  await loadState();
  state.route = window.location.hash || '#home';
  render();
}
init();
/* Gentle auto-refresh while the customer is looking at their orders or the
   admin is on the Orders/Customers tab. This simply re-reads the shared
   data; it is not a push notification. It skips re-rendering while a form
   control is focused so it never closes a dropdown mid-use. */
setInterval(()=>{
  if(state.loading) return;
  const r = state.route || '';
  const watching = r==='#account' || r.startsWith('#order-') || (r==='#admin' && state.adminAuthed && (state.adminTab==='orders' || state.adminTab==='customers'));
  if(!watching) return;
  refreshShared().then(()=>{
    const a = document.activeElement;
    if(!a || !['INPUT','SELECT','TEXTAREA'].includes(a.tagName)) render();
  });
}, 20000);
</script>
